name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "contracts/theme/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "contracts/theme/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod

      - name: Start isolated CockroachDB
        run: |
          docker run -d --name theme-api-db -p 127.0.0.1:26257:26257 cockroachdb/cockroach:v25.4.17 start-single-node --insecure --store=type=mem,size=1GiB
          for attempt in $(seq 1 30); do
            if docker exec theme-api-db cockroach sql --insecure --execute='SELECT 1'; then
              exit 0
            fi
            sleep 2
          done
          docker logs theme-api-db
          exit 1

      - name: Run tests including database integration
        env:
          TEST_DATABASE_URL: postgresql://root@127.0.0.1:26257/defaultdb?sslmode=disable
        run: go test -count=1 ./...

      - name: Stop isolated CockroachDB
        if: always()
        run: docker rm -f theme-api-db
