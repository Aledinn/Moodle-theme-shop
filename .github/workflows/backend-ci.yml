name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "contracts/theme/**"
      - ".dockerignore"
      - "*compose*.yml"
      - ".github/workflows/**"
      - "tools/ci/**"
  pull_request:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "contracts/theme/**"
      - ".dockerignore"
      - "*compose*.yml"
      - ".github/workflows/**"
      - "tools/ci/**"

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/backend/go.mod

      - name: Run Go and initialized database integration tests
        working-directory: .
        run: bash tools/ci/backend-tests.sh

      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/ci/backend/
          retention-days: 7
          include-hidden-files: true
