name: Website containers CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/backend/**"
      - "contracts/theme/**"
      - "compose.local.yml"
      - ".github/workflows/web-containers-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/backend/**"
      - "contracts/theme/**"
      - "compose.local.yml"
      - ".github/workflows/web-containers-ci.yml"

permissions:
  contents: read

jobs:
  containers:
    name: Website and API on one origin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:containers
