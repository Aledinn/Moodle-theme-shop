name: Website containers CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/backend/**"
      - "apps/extension/**"
      - ".dockerignore"
      - "docker-compose.yml"
      - "contracts/theme/**"
      - "compose.local.yml"
      - ".github/workflows/**"
      - "tools/ci/**"
      - "tools/seed-local-theme.mjs"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/backend/**"
      - "apps/extension/**"
      - ".dockerignore"
      - "docker-compose.yml"
      - "contracts/theme/**"
      - "compose.local.yml"
      - ".github/workflows/**"
      - "tools/ci/**"
      - "tools/seed-local-theme.mjs"

permissions:
  contents: read

jobs:
  website:
    name: Website and local extension import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/extension/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm ci
        working-directory: apps/extension
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Download, import and apply against local Moodle fixture
        run: npm run test:extension
        working-directory: apps/web
      - name: Browser failures, retry and visitors without the extension
        run: npm run test:catalog && npm run test:details
        working-directory: apps/web
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: website-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/.cache/ci/
          retention-days: 7
          include-hidden-files: true

  containers:
    name: Website and API on one origin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/extension/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/extension
      - run: npx playwright install --with-deps chromium
      - run: npm run test:containers
      - name: Broken contract must block the release image
        working-directory: .
        run: node tools/ci/check-release-gate.mjs
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: containers-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/.cache/ci/
            .cache/ci/release-gate.log
          retention-days: 7
          include-hidden-files: true
