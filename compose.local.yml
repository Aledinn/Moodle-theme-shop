# Independent from docker-compose.yml: no fixed container names or shared volumes.
name: moodle-shop-local
services:
  db:
    image: cockroachdb/cockroach:v25.4.17
    command: start-single-node --insecure
    volumes:
      - local-db:/cockroach/cockroach-data
    healthcheck:
      test: [CMD, /cockroach/cockroach, sql, --insecure, --host=localhost:26257, --execute=SELECT 1]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  bootstrap:
    image: cockroachdb/cockroach:v25.4.17
    depends_on:
      db:
        condition: service_healthy
    entrypoint: [/cockroach/cockroach, sql, --insecure, --host=db:26257, --file=/migrations/001.sql]
    volumes:
      - ./apps/backend/migrations:/migrations:ro
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: apps/backend/dockerfile
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "26257"
      PGUSER: root
      PGPASSWORD: ""
      PGDATABASE: mydb
    restart: on-failure

  web:
    build:
      context: ./apps/web
    depends_on:
      backend:
        condition: service_started
    environment:
      WEB_API_UPSTREAM: backend:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/api/themes?limit=1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  local-db:
