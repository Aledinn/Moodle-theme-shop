services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: themeshop
    ports:
      - "5432:5432"
    volumes:
     - pgdata:/var/lib/postgresql/data
     - ./apps/backend/migrations:/docker-entrypoint-initdb.d/

volumes:
  pgdata: