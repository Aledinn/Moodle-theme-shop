<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
    <title>Moodle theme addon: popup</title>
</head>
<body>
    Welcome to the <span class="special-text">Moodle theme addon</span> popup!
    <button id="toggle_theme">Toggle theme</button>
    <button id="select_element">Select element</button>
    <button id="install_theme">Install theme</button>
    <label>
    Property:
    <select id="css_property">
        <option value="background-color">Background color</option>
        <option value="color">Text color</option>
    </select>
    </label>

    <label>
        Color:
        <input id="css_color" type="color" value="#ff0000">
    </label>
    <script type="module" src="../popup.js"></script>
</body>
</html>
